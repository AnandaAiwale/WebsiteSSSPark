<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e17" />
      <stop offset="100%" stop-color="#12382c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144234" />
      <stop offset="100%" stop-color="#0a241c" />
    </linearGradient>
    <filter id="cashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#cashBg)" />
  
  <!-- Subtle ambient glow -->
  <circle cx="150" cy="80" r="120" fill="#10b981" opacity="0.15" filter="url(#cashGlow)" />
  <circle cx="480" cy="280" r="110" fill="#f59e0b" opacity="0.12" filter="url(#cashGlow)" />

  <!-- Center Mobile Phone Mockup -->
  <g transform="translate(170, 20)">
    <!-- Phone Outer Shell -->
    <rect width="260" height="340" rx="28" fill="#061611" stroke="#225d4c" stroke-width="2" />
    
    <!-- Screen -->
    <rect x="8" y="8" width="244" height="324" rx="20" fill="url(#phoneCardGrad)" />
    
    <!-- Phone Speaker Notch -->
    <rect x="95" y="14" width="70" height="5" rx="2.5" fill="#061611" />
    
    <!-- App Header -->
    <text x="130" y="42" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">CashCount</text>
    <text x="130" y="55" fill="#a7f3d0" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.8">Smart Daily Register Tally</text>

    <!-- Total Display Banner -->
    <g transform="translate(18, 65)">
      <rect width="208" height="58" rx="12" fill="#042017" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="20" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Total Cash Counted</text>
      <text x="14" y="46" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">₹ 86,450</text>
      <rect x="145" y="16" width="50" height="18" rx="9" fill="#065f46" />
      <text x="170" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">186 Notes</text>
    </g>

    <!-- Denominations Grid -->
    <g transform="translate(18, 134)">
      <!-- 500 Note -->
      <rect width="208" height="36" rx="8" fill="#09281e" stroke="#1b4d3e" stroke-width="1" />
      <rect x="8" y="7" width="46" height="22" rx="4" fill="#10b981" opacity="0.2" />
      <text x="31" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">₹500</text>
      <text x="65" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">×</text>
      <rect x="78" y="8" width="38" height="20" rx="4" fill="#042017" stroke="#225d4c" stroke-width="0.8" />
      <text x="97" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">140</text>
      <text x="195" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="end">₹70,000</text>

      <!-- 200 Note -->
      <g transform="translate(0, 42)">
        <rect width="208" height="36" rx="8" fill="#09281e" stroke="#1b4d3e" stroke-width="1" />
        <rect x="8" y="7" width="46" height="22" rx="4" fill="#f59e0b" opacity="0.2" />
        <text x="31" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">₹200</text>
        <text x="65" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">×</text>
        <rect x="78" y="8" width="38" height="20" rx="4" fill="#042017" stroke="#225d4c" stroke-width="0.8" />
        <text x="97" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">52</text>
        <text x="195" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="end">₹10,400</text>
      </g>

      <!-- 100 Note -->
      <g transform="translate(0, 84)">
        <rect width="208" height="36" rx="8" fill="#09281e" stroke="#1b4d3e" stroke-width="1" />
        <rect x="8" y="7" width="46" height="22" rx="4" fill="#3b82f6" opacity="0.2" />
        <text x="31" y="22" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">₹100</text>
        <text x="65" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">×</text>
        <rect x="78" y="8" width="38" height="20" rx="4" fill="#042017" stroke="#225d4c" stroke-width="0.8" />
        <text x="97" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">55</text>
        <text x="195" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="end">₹5,500</text>
      </g>

      <!-- 50 Note -->
      <g transform="translate(0, 126)">
        <rect width="208" height="36" rx="8" fill="#09281e" stroke="#1b4d3e" stroke-width="1" />
        <rect x="8" y="7" width="46" height="22" rx="4" fill="#a855f7" opacity="0.2" />
        <text x="31" y="22" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">₹50</text>
        <text x="65" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">×</text>
        <rect x="78" y="8" width="38" height="20" rx="4" fill="#042017" stroke="#225d4c" stroke-width="0.8" />
        <text x="97" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">11</text>
        <text x="195" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="end">₹550</text>
      </g>
    </g>

    <!-- Bottom Action Pill inside screen -->
    <g transform="translate(26, 305)">
      <rect width="192" height="18" rx="9" fill="#0f3d2f" />
      <text x="96" y="13" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Instant Share to WhatsApp &amp; PDF Export</text>
    </g>
  </g>

  <!-- Left Floating Feature Tag -->
  <g transform="translate(20, 140)">
    <rect width="135" height="60" rx="10" fill="#0b241c" stroke="#1a5240" stroke-width="1.2" />
    <circle cx="22" cy="22" r="5" fill="#f59e0b" />
    <text x="34" y="25" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">Coming Soon</text>
    <text x="14" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="9">Daily register balance without mental math</text>
  </g>

  <!-- Right Floating Feature Tag -->
  <g transform="translate(445, 140)">
    <rect width="135" height="60" rx="10" fill="#0b241c" stroke="#1a5240" stroke-width="1.2" />
    <circle cx="22" cy="22" r="5" fill="#10b981" />
    <text x="34" y="25" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Offline &amp; Secure</text>
    <text x="14" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="9">Zero cloud latency. Data stays in your phone</text>
  </g>
</svg>
