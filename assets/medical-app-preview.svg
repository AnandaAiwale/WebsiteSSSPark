<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />
  
  <!-- Ambient light circles -->
  <circle cx="500" cy="80" r="120" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="100" cy="300" r="100" fill="#10b981" opacity="0.1" filter="url(#softGlow)" />

  <!-- App Window Container -->
  <g transform="translate(30, 25)">
    <!-- Window Frame -->
    <rect width="540" height="330" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M0 10 C0 4.5 4.5 0 10 0 L530 0 C535.5 0 540 4.5 540 10 L540 38 L0 38 Z" fill="#0f172a" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="270" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Shivshambhu Medical ERP — Inventory &amp; Stock Manager</text>

    <!-- Sidebar -->
    <rect x="0" y="38" width="130" height="292" fill="#0f172a" opacity="0.7" />
    <rect x="12" y="55" width="106" height="28" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="32" y="73" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">📦 Inventory</text>
    <text x="32" y="108" fill="#94a3b8" font-family="sans-serif" font-size="11">🧾 Fast Billing</text>
    <text x="32" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11">📍 Box &amp; Racks</text>
    <text x="32" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11">⚠️ Expiry Watch</text>
    <text x="32" y="204" fill="#94a3b8" font-family="sans-serif" font-size="11">📊 GST Reports</text>

    <!-- Top KPI cards in content area -->
    <g transform="translate(145, 50)">
      <!-- KPI 1 -->
      <rect width="115" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" text-transform="uppercase">Total Stock</text>
      <text x="12" y="42" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="800">12,480</text>
      <text x="75" y="42" fill="#38bdf8" font-family="sans-serif" font-size="10">SKUs</text>

      <!-- KPI 2 -->
      <rect x="125" y="0" width="125" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="137" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" text-transform="uppercase">Box &amp; Rack Sync</text>
      <text x="137" y="42" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="800">100%</text>
      <text x="185" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Mapped</text>

      <!-- KPI 3 -->
      <rect x="260" y="0" width="120" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="272" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" text-transform="uppercase">Expiry Shield</text>
      <text x="272" y="42" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="800">0 Batches</text>
    </g>

    <!-- Inventory / Stock Table -->
    <g transform="translate(145, 115)">
      <rect width="380" height="200" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- Table Header -->
      <path d="M0 8 C0 3.5 3.5 0 8 0 L372 0 C376.5 0 380 3.5 380 8 L380 26 L0 26 Z" fill="#1e293b" />
      <text x="12" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700">MEDICINE / FORMULATION</text>
      <text x="175" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700">RACK / BOX</text>
      <text x="255" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700">STOCK</text>
      <text x="320" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700">STATUS</text>

      <!-- Row 1 -->
      <line x1="0" y1="58" x2="380" y2="58" stroke="#334155" stroke-width="1" />
      <text x="12" y="44" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Amoxicillin 500mg Strip</text>
      <text x="12" y="55" fill="#64748b" font-family="sans-serif" font-size="9">Batch: AMX-204 • Exp: 10/28</text>
      <rect x="175" y="36" width="60" height="18" rx="4" fill="#0369a1" opacity="0.3" />
      <text x="183" y="49" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Rack B-04</text>
      <text x="255" y="48" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">320 Strips</text>
      <rect x="320" y="37" width="50" height="16" rx="4" fill="#065f46" />
      <text x="327" y="49" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">In Stock</text>

      <!-- Row 2 -->
      <line x1="0" y1="92" x2="380" y2="92" stroke="#334155" stroke-width="1" />
      <text x="12" y="76" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Paracetamol 650mg Dolo</text>
      <text x="12" y="87" fill="#64748b" font-family="sans-serif" font-size="9">Batch: DOL-991 • Exp: 06/29</text>
      <rect x="175" y="68" width="60" height="18" rx="4" fill="#0369a1" opacity="0.3" />
      <text x="183" y="81" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Rack A-01</text>
      <text x="255" y="80" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">840 Strips</text>
      <rect x="320" y="69" width="50" height="16" rx="4" fill="#065f46" />
      <text x="327" y="81" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">In Stock</text>

      <!-- Row 3 -->
      <line x1="0" y1="126" x2="380" y2="126" stroke="#334155" stroke-width="1" />
      <text x="12" y="109" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Azithromycin 500mg Tab</text>
      <text x="12" y="120" fill="#64748b" font-family="sans-serif" font-size="9">Batch: AZ-110 • Exp: 12/27</text>
      <rect x="175" y="101" width="60" height="18" rx="4" fill="#0369a1" opacity="0.3" />
      <text x="183" y="114" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Box C-12</text>
      <text x="255" y="113" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">110 Boxes</text>
      <rect x="320" y="102" width="50" height="16" rx="4" fill="#065f46" />
      <text x="327" y="114" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">In Stock</text>

      <!-- Row 4 -->
      <line x1="0" y1="160" x2="380" y2="160" stroke="#334155" stroke-width="1" />
      <text x="12" y="142" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Cough Syrup DX 100ml</text>
      <text x="12" y="153" fill="#64748b" font-family="sans-serif" font-size="9">Batch: CS-830 • Exp: 04/28</text>
      <rect x="175" y="134" width="60" height="18" rx="4" fill="#0369a1" opacity="0.3" />
      <text x="183" y="147" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Rack D-02</text>
      <text x="255" y="146" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">45 Bottles</text>
      <rect x="320" y="135" width="50" height="16" rx="4" fill="#854d0e" />
      <text x="328" y="147" fill="#fde047" font-family="sans-serif" font-size="9" font-weight="700">Low Stock</text>

      <!-- Offline Ready indicator bottom -->
      <rect x="10" y="169" width="360" height="22" rx="4" fill="#1e293b" />
      <circle cx="24" cy="180" r="4" fill="#10b981" />
      <text x="36" y="184" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">100% Offline-Ready Desktop Engine • Instant Barcode POS &amp; Thermal Receipt Printer Connected</text>
    </g>
  </g>
</svg>
