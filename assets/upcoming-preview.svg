<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="upGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1d36" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="upGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#upGrad)" />
  
  <circle cx="120" cy="100" r="120" fill="#8b5cf6" opacity="0.14" filter="url(#upGlow)" />
  <circle cx="500" cy="280" r="120" fill="#ec4899" opacity="0.12" filter="url(#upGlow)" />

  <!-- Center Architecture Blueprint Grid -->
  <g transform="translate(40, 35)">
    <!-- Main Blueprint Container -->
    <rect width="520" height="310" rx="12" fill="#181728" stroke="#312e52" stroke-width="1.5" />
    
    <!-- Header -->
    <path d="M0 12 C0 5.5 5.5 0 12 0 L508 0 C514.5 0 520 5.5 520 12 L520 40 L0 40 Z" fill="#131221" />
    <circle cx="20" cy="20" r="5" fill="#a855f7" />
    <circle cx="36" cy="20" r="5" fill="#ec4899" />
    <circle cx="52" cy="20" r="5" fill="#38bdf8" />
    <text x="260" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">Shivshambhu Innovation Pipeline &amp; Custom Labs</text>

    <!-- Node 1: Fleet IoT -->
    <g transform="translate(30, 65)">
      <rect width="215" height="100" rx="10" fill="#1f1d38" stroke="#6366f1" stroke-width="1.2" />
      <rect x="15" y="14" width="28" height="28" rx="6" fill="#4338ca" />
      <text x="29" y="32" fill="#e0e7ff" font-family="sans-serif" font-size="14" text-anchor="middle">🛰️</text>
      <text x="52" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Fleet &amp; Asset IoT</text>
      <text x="52" y="39" fill="#c7d2fe" font-family="sans-serif" font-size="9" font-weight="600">Smart Vehicle Telematics</text>
      <text x="15" y="65" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Real-time GPS tracking, dispatch alerts, and digital sensor loggers.</text>
      <rect x="15" y="78" width="70" height="14" rx="3" fill="#312e81" />
      <text x="50" y="88" fill="#a5b4fc" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Prototyping</text>
    </g>

    <!-- Node 2: Retail Cloud POS -->
    <g transform="translate(275, 65)">
      <rect width="215" height="100" rx="10" fill="#1f1d38" stroke="#ec4899" stroke-width="1.2" />
      <rect x="15" y="14" width="28" height="28" rx="6" fill="#9d174d" />
      <text x="29" y="32" fill="#fce7f3" font-family="sans-serif" font-size="14" text-anchor="middle">⚡</text>
      <text x="52" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Omni-Channel Retail</text>
      <text x="52" y="39" fill="#fbcfe8" font-family="sans-serif" font-size="9" font-weight="600">Cloud Sync &amp; Multi-Store</text>
      <text x="15" y="65" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Unified inventory across multiple branches with automated GST filing.</text>
      <rect x="15" y="78" width="70" height="14" rx="3" fill="#831843" />
      <text x="50" y="88" fill="#f472b6" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Architecture</text>
    </g>

    <!-- Node 3: Custom Enterprise Suite -->
    <g transform="translate(30, 185)">
      <rect width="460" height="95" rx="10" fill="#1f1d38" stroke="#8b5cf6" stroke-width="1.2" />
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#6d28d9" />
      <text x="29" y="33" fill="#f5f3ff" font-family="sans-serif" font-size="14" text-anchor="middle">💡</text>
      <text x="52" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Have a Custom Product or Startup Idea?</text>
      <text x="52" y="40" fill="#ddd6fe" font-family="sans-serif" font-size="9.5">We build bespoke software from napkin sketches to production deploy.</text>
      
      <!-- Feature Pills -->
      <g transform="translate(15, 60)">
        <rect width="130" height="22" rx="4" fill="#312e52" />
        <text x="65" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">✓ Full Source Ownership</text>
        <rect x="140" y="0" width="130" height="22" rx="4" fill="#312e52" />
        <text x="205" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">✓ Modern Microservices</text>
        <rect x="280" y="0" width="140" height="22" rx="4" fill="#312e52" />
        <text x="350" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">✓ Ongoing Maintenance</text>
      </g>
    </g>
  </g>
</svg>
